<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Hand Tracking MAX</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #030305;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    .nav-group {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 2000;
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      padding: 10px 20px;
      font-size: 0.85em;
      font-weight: bold;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 3px;
      transition: all 0.2s;
      cursor: pointer;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    #back-btn {
      background: rgba(0, 255, 255, 0.15);
      border: 2px solid #0ff;
      color: #0ff;
      text-shadow: 0 0 5px #0ff;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5) inset;
    }

    #reload-btn {
      background: rgba(255, 0, 255, 0.15);
      border: 2px solid #f0f;
      color: #f0f;
      text-shadow: 0 0 5px #f0f;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.5) inset;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    #status-log {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: #0ff;
      font-size: 14px;
      z-index: 2000;
      text-shadow: 0 0 5px #0ff;
      background: rgba(0, 255, 255, 0.05);
      padding: 5px 10px;
      border-left: 4px solid #0ff;
    }

    /* CRT Scanline effect */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1500;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="scanlines"></div>
  <div class="nav-group">
    <a href="../perception_demo.html" id="back-btn" class="nav-btn">HUB</a>
    <div id="reload-btn" class="nav-btn" onclick="location.reload()">REBOOT</div>
  </div>

  <div id="status-log">SYS.INITIALIZING...</div>

  <script>
    let video, handPose, hands = [];
    let isReady = false;
    let smoothedAngle = [0, 0], lastTickAngle = [0, 0], smoothedPos = [{ x: 0, y: 0 }, { x: 0, y: 0 }];
    let mainColor, colors = ['#00ffff', '#ff00ff', '#ffff00'], colorIdx = 0;
    let glitchTimer = 0, osc, envelope, linkOsc;
    let score = 0, highScore = 0;

    let buttons = [
      { label: 'COLOR', x: 40, y: 120, w: 100, h: 40, active: false },
      { label: 'GLITCH', x: 40, y: 180, w: 100, h: 40, active: false }
    ];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      mainColor = color(colors[colorIdx]);

      osc = new p5.Oscillator('square');
      envelope = new p5.Envelope();
      envelope.setADSR(0.01, 0.1, 0.2, 0.1);
      envelope.setRange(0.4, 0);

      linkOsc = new p5.Oscillator('sawtooth');
      linkOsc.amp(0);

      updateLog("LOADING ML MODEL...");
      // Auto initialize on load, no button needed
      handPose = ml5.handPose({ flipped: true, maxHands: 2 }, () => {
        updateLog("MODEL ONLINE. ACCESSING OPTICS...");
        initCamera();
      });
      angleMode(DEGREES);
      textFont('Courier New');
    }

    function updateLog(msg) {
      document.getElementById('status-log').innerText = `SYS_LOG // ${msg}`;
    }

    function initCamera() {
      video = createCapture(VIDEO, () => {
        updateLog("OPTICS ONLINE. DETECTING...");
        video.hide();
        startDetection();
      });
      video.size(640, 480);
    }

    function startDetection() {
      isReady = true;
      handPose.detectStart(video, results => {
        hands = results;
      });
    }

    function playTone(freq) {
      if (getAudioContext().state !== 'running') userStartAudio();
      osc.freq(freq); osc.start(); envelope.play(osc);
    }

    // 座標映射函數 (針對畫面放大和翻轉處理)
    function getScreenX(camX, gx) {
      let vW = width * 1.5;
      // 原本 x 範圍: 0 到 640
      // 因為畫面有 scale(-1, 1)，所以 0 對應右邊 (+vW/2)，640 對應左邊 (-vW/2)
      return width / 2 + map(camX, 0, 640, vW / 2, -vW / 2) + gx;
    }

    function getScreenY(camY, gy) {
      let vH = height * 1.5;
      return height / 2 + map(camY, 0, 480, -vH / 2, vH / 2) + gy;
    }

    function draw() {
      background(5, 5, 12);
      if (!isReady) return;

      let gx = (glitchTimer > 0) ? random(-15, 15) : 0;
      let gy = (glitchTimer > 0) ? random(-15, 15) : 0;
      if (glitchTimer > 0) glitchTimer--;

      push();
      // 畫面放大 1.5 倍並置中
      translate(width / 2 + gx, height / 2 + gy);
      scale(-1, 1);
      imageMode(CENTER);
      // Cyberpunk style tint
      tint(red(mainColor), green(mainColor), blue(mainColor), 200);
      let vW = width * 1.5;
      let vH = height * 1.5;
      image(video, 0, 0, vW, vH);
      pop();

      let targetScore = 0;

      if (hands && hands.length > 0) {
        targetScore += hands.length * 30; // 偵測到手的基本分

        for (let i = 0; i < hands.length; i++) {
          let hand = hands[i];
          let indexTip = hand.keypoints[8];
          let tx = getScreenX(indexTip.x, gx);
          let ty = getScreenY(indexTip.y, gy);

          checkButtons(tx, ty);
          drawSciFiSkeleton(hand, gx, gy);
          drawFingertips(hand, gx, gy);
          drawCursor(tx, ty);
        }

        if (hands.length === 2) {
          let h1x = getScreenX(hands[0].keypoints[9].x, gx);
          let h1y = getScreenY(hands[0].keypoints[9].y, gy);
          let h2x = getScreenX(hands[1].keypoints[9].x, gx);
          let h2y = getScreenY(hands[1].keypoints[9].y, gy);

          let d = dist(h1x, h1y, h2x, h2y);
          let proximity = map(d, 50, 1000, 1, 0, true);
          drawEnergyLink(h1x, h1y, h2x, h2y, proximity, gx, gy);

          if (getAudioContext().state === 'running') {
            linkOsc.amp(map(proximity, 0, 1, 0.05, 0.5), 0.1);
            linkOsc.freq(80 + proximity * 300);
            linkOsc.start();
          }
          targetScore += proximity * 150; // 連接的加分
        } else {
          linkOsc.amp(0, 0.5);
        }
      } else {
        linkOsc.amp(0, 0.5);
      }

      // 分數平滑上升/下降
      score = lerp(score, targetScore, 0.1);
      if (score > highScore) highScore = score;

      drawVirtualButtons(gx, gy);
      drawScoreBar();
    }

    function drawScoreBar() {
      let barWidth = 20;
      let maxBarHeight = height * 0.5;
      let startX = width - 40;
      let startY = height / 2 + maxBarHeight / 2;

      let maxVal = max(200, highScore);

      // 外框
      noFill();
      stroke(mainColor, 100);
      strokeWeight(2);
      rect(startX, startY - maxBarHeight, barWidth, maxBarHeight);

      // 最高分 (紅色)
      let hsHeight = map(highScore, 0, maxVal, 0, maxBarHeight, true);
      fill(255, 0, 0, 180);
      noStroke();
      rect(startX, startY - hsHeight, barWidth, hsHeight);

      // 最高分文字
      fill(255, 50, 50);
      textAlign(RIGHT, CENTER);
      textSize(14); textStyle(BOLD);
      text("MAX:" + int(highScore), startX - 10, startY - hsHeight);

      // 當前分
      let sHeight = map(score, 0, maxVal, 0, maxBarHeight, true);
      fill(mainColor);
      rect(startX, startY - sHeight, barWidth, sHeight);

      // 當前分文字
      fill(255);
      text("POW:" + int(score), startX - 10, startY - sHeight);
    }

    function drawEnergyLink(p1x, p1y, p2x, p2y, k, gx, gy) {
      let linkColor = lerpColor(mainColor, color(255, 0, 255), k);
      strokeWeight(3 + k * 12);
      stroke(linkColor);
      beginShape(); noFill();
      for (let t = 0; t <= 1; t += 0.05) {
        vertex(lerp(p1x, p2x, t) + random(-k * 20, k * 20), lerp(p1y, p2y, t) + random(-k * 20, k * 20));
      }
      endShape();
      fill(255); noStroke();
      circle((p1x + p2x) / 2, (p1y + p2y) / 2, 20 + k * 30);
    }

    function checkButtons(x, y) {
      buttons.forEach(btn => {
        let isInside = x > btn.x && x < btn.x + btn.w && y > btn.y && y < btn.y + btn.h;
        if (isInside && !btn.active) {
          btn.active = true;
          playTone(800);
          if (btn.label === 'COLOR') { colorIdx = (colorIdx + 1) % colors.length; mainColor = color(colors[colorIdx]); }
          else if (btn.label === 'GLITCH') { glitchTimer = 25; playTone(200); }
        } else if (!isInside) { btn.active = false; }
      });
    }

    function drawSciFiSkeleton(hand, gx, gy) {
      stroke(mainColor, 180);
      strokeWeight(3);
      let connections = handPose.getConnections();
      for (let i = 0; i < connections.length; i++) {
        let a = connections[i][0], b = connections[i][1];
        let ax = getScreenX(hand.keypoints[a].x, gx);
        let ay = getScreenY(hand.keypoints[a].y, gy);
        let bx = getScreenX(hand.keypoints[b].x, gx);
        let by = getScreenY(hand.keypoints[b].y, gy);
        line(ax, ay, bx, by);
      }
    }

    function drawFingertips(hand, gx, gy) {
      [4, 8, 12, 16, 20].forEach(idx => {
        let k = hand.keypoints[idx];
        let x = getScreenX(k.x, gx);
        let y = getScreenY(k.y, gy);
        fill(mainColor); noStroke(); circle(x, y, 10);
        fill(255); textSize(10); textAlign(LEFT); text(` n${idx}`, x + 8, y);
      });
    }

    function drawVirtualButtons(gx, gy) {
      buttons.forEach(btn => {
        push(); translate(btn.x + gx / 3, btn.y + gy / 3);
        noFill(); stroke(mainColor); strokeWeight(2);
        rect(0, 0, btn.w, btn.h, 0); // 銳利直角

        if (btn.active) { fill(mainColor); }
        else { fill(0, 50); }
        rect(0, 0, btn.w, btn.h);

        fill(btn.active ? 0 : 255);
        textAlign(CENTER, CENTER); textSize(14); fontStyle = 'bold';
        text(btn.label, btn.w / 2, btn.h / 2);
        pop();
      });
    }

    function drawCursor(tx, ty) {
      fill(255); noStroke(); circle(tx, ty, 6);
      noFill(); stroke(255, 0, 255); strokeWeight(2);
      circle(tx, ty, 20 + sin(frameCount * 10) * 8);
      line(tx - 15, ty, tx + 15, ty);
      line(tx, ty - 15, tx, ty + 15);
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>

</html>
